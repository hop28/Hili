<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إعلان دورات المهندس حسن فلاح الموسوي</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/cairo@latest/arabic-900-normal.css">
<!-- Whammy: offline WebM encoder (no browser recording) -->
<script src="https://cdn.jsdelivr.net/gh/antimatter15/whammy/whammy.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}
  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(70,130,220,.10), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(90,70,200,.10), transparent 55%),
      linear-gradient(160deg,#05060d 0%,#0a0d18 50%,#05060d 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;color:#e9ecf2;overflow-x:hidden;
  }
  .wrapper{display:flex;gap:34px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .phone{
    width:392px;padding:12px;border-radius:54px;position:relative;
    background:linear-gradient(150deg,#262a35,#0a0b10 40%,#181b24);
    box-shadow:0 40px 90px rgba(0,80,180,.18),0 0 0 1px rgba(255,255,255,.06),
      inset 0 0 0 2px rgba(0,0,0,.6);
  }
  .phone::after{content:'';position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:108px;height:26px;background:#05060a;border-radius:16px;z-index:10;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  .btn-side{position:absolute;right:-3px;width:3px;border-radius:3px;background:#262a35;}
  .btn-side.p1{top:152px;height:58px;}
  .btn-side.p2{top:230px;height:58px;}
  .screen{width:100%;aspect-ratio:9/16;border-radius:44px;overflow:hidden;
    position:relative;background:#04050c;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);}
  canvas{width:100%;height:100%;display:block;}
  .controls{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:22px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(14px);min-width:296px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  h1{font-size:15px;font-weight:900;line-height:1.5;
    background:linear-gradient(90deg,#69c4ff,#9b8bff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  p.sub{font-size:11px;color:#7f8796;line-height:1.7;margin-top:4px;}
  button{padding:13px 18px;border:none;border-radius:12px;cursor:pointer;
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13.5px;
    transition:.2s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;
    justify-content:center;gap:9px;}
  .btn-play{background:linear-gradient(135deg,#3fb5f0,#1a63d8);color:#fff;
    box-shadow:0 8px 24px rgba(40,120,220,.30);}
  .btn-dl{background:linear-gradient(135deg,#2bc46a,#138a48);color:#fff;
    box-shadow:0 8px 24px rgba(35,180,95,.28);}
  .btn-dl.busy{background:linear-gradient(135deg,#5a6570,#3d4650);box-shadow:none;}
  .btn-reset{background:rgba(255,255,255,.05);color:#c6cdd9;
    border:1px solid rgba(255,255,255,.09);}
  .btn-voice{background:rgba(155,139,255,.12);color:#c6b8ff;
    border:1px solid rgba(155,139,255,.25);}
  .btn-voice.off{background:rgba(255,255,255,.04);color:#7f8796;
    border:1px solid rgba(255,255,255,.08);}
  button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .icon{width:16px;height:16px;flex-shrink:0;}
  .progress{width:100%;height:4px;background:rgba(255,255,255,.06);
    border-radius:3px;overflow:hidden;margin-top:6px;}
  .progress-bar{height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,#69c4ff,#9b8bff);transition:width .08s linear;}
  .time{font-size:11px;color:#6a7285;text-align:center;
    font-variant-numeric:tabular-nums;letter-spacing:.4px;}
  .status{font-size:11px;color:#69c4ff;text-align:center;min-height:30px;
    display:flex;align-items:center;justify-content:center;padding:7px;
    border-radius:8px;background:rgba(105,196,255,.06);
    border:1px solid rgba(105,196,255,.12);line-height:1.4;}
  .note{font-size:10px;color:#5c6472;line-height:1.6;padding:8px;text-align:center;
    border-top:1px solid rgba(255,255,255,.05);margin-top:4px;}
  @media(max-width:760px){
    .wrapper{flex-direction:column;gap:22px;}
    .controls{min-width:auto;width:392px;}
    .phone{width:100%;max-width:392px;}
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="phone">
    <div class="btn-side p1"></div>
    <div class="btn-side p2"></div>
    <div class="screen">
      <canvas id="c" width="1440" height="2560"></canvas>
    </div>
  </div>
  <div class="controls">
    <div>
      <h1>إعلان دورات المهندس حسن فلاح الموسوي</h1>
      <p class="sub">موشن جرافيك سينمائي متصل • 16 ثانية • 1080×1920</p>
    </div>
    <button class="btn-play" id="playBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      تشغيل الإعلان
    </button>
    <button class="btn-voice" id="voiceBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <span id="voiceLabel">التعليق الصوتي: مفعّل</span>
    </button>
    <button class="btn-dl" id="dlBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span id="dlLabel">تنزيل الفيديو مباشرة</span>
    </button>
    <button class="btn-reset" id="resetBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      إعادة تعيين
    </button>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="time" id="time">00:00 / 00:16</div>
    <div class="status" id="status">جاهز للتشغيل</div>
    <div class="note">الفيديو يُبنى إطاراً بإطار مباشرة في المتصفح (بدون تسجيل شاشة). الناتج ملف WebM بجودة 1080×1920 — صالح للتحويل إلى MP4 بأي أداة.</div>
  </div>
</div>

<script>
/* ============================================================
   CORE SETUP — canvas/ctx/RES_SCALE are `let` because we swap
   them temporarily during the offline export.
   ============================================================ */
let canvas = document.getElementById('c');
let ctx = canvas.getContext('2d', { alpha: false });
const W = 1080, H = 1920;
let RES_SCALE = canvas.width / W;
const DURATION = 16.0;

/* ============================================================
   EASING
   ============================================================ */
function cb(p1x,p1y,p2x,p2y){
  return function(t){
    if(t<=0) return 0;
    if(t>=1) return 1;
    let u = t;
    for(let i=0;i<8;i++){
      const x = 3*(1-u)*(1-u)*u*p1x + 3*(1-u)*u*u*p2x + u*u*u;
      const dx = 3*(1-u)*(1-u)*p1x + 6*(1-u)*u*(p2x-p1x) + 3*u*u*(1-p2x);
      if(Math.abs(dx) < 1e-6) break;
      u = Math.max(0, Math.min(1, u - (x-t)/dx));
    }
    return 3*(1-u)*(1-u)*u*p1y + 3*(1-u)*u*u*p2y + u*u*u;
  };
}
const E = {
  outExpo:    cb(0.16, 1, 0.3, 1),
  outQuint:   cb(0.22, 1, 0.36, 1),
  outQuart:   cb(0.25, 1, 0.5, 1),
  outCubic:   cb(0.33, 1, 0.68, 1),
  inOutQuart: cb(0.76, 0, 0.24, 1),
  inOutCubic: cb(0.65, 0, 0.35, 1),
  inExpo:     cb(0.7, 0, 0.84, 0),
  inCubic:    cb(0.32, 0, 0.67, 0),
  outBack:    cb(0.34, 1.4, 0.64, 1),
  inOutSine:  cb(0.37, 0, 0.63, 1)
};
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;

/* ============================================================
   SVG PATHS
   ============================================================ */
const WHATSAPP_LOGO = "M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z";
const PHONE_ICON = "M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z";
const PIN_ICON = "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z";

function drawSvgPath(pathStr, x, y, size, color, glowColor, glowBlur){
  const p = new Path2D(pathStr);
  ctx.save();
  ctx.translate(x, y);
  const s = size / 24;
  ctx.scale(s, s);
  ctx.translate(-12, -12);
  if(glowColor){ ctx.shadowColor = glowColor; ctx.shadowBlur = glowBlur || 30; }
  ctx.fillStyle = color;
  ctx.fill(p);
  ctx.fill(p);
  ctx.restore();
}

/* ============================================================
   TEXT HELPERS
   ============================================================ */
function fontPx(font){
  const m = font.match(/(\d+(?:\.\d+)?)px/);
  return m ? parseFloat(m[1]) : 48;
}

function revealText(text, cx, cy, font, opts){
  ctx.save();
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const m = ctx.measureText(text);
  const tw = m.width;
  const fs = fontPx(font);
  const asc = m.actualBoundingBoxAscent || fs*0.85;
  const desc = m.actualBoundingBoxDescent || fs*0.35;
  const th = asc + desc;

  const PAD_X = 120, PAD_Y = 70;
  const boxW = tw + PAD_X*2;
  const boxH = th + PAD_Y*2;

  const p = clamp(opts.progress, 0, 1);
  const e = (opts.easing || E.outExpo)(p);

  let clipX, clipY, clipW, clipH;
  const bx = cx - boxW/2, by = cy - boxH/2;

  if(opts.dir === 'rtl'){ clipX = bx + boxW*(1-e); clipY = by; clipW = boxW*e; clipH = boxH; }
  else if(opts.dir === 'ltr'){ clipX = bx; clipY = by; clipW = boxW*e; clipH = boxH; }
  else if(opts.dir === 'up'){ clipX = bx; clipY = by + boxH*(1-e); clipW = boxW; clipH = boxH*e; }
  else { clipX = bx; clipY = by; clipW = boxW; clipH = boxH*e; }

  if(clipW <= 0 || clipH <= 0){ ctx.restore(); return; }

  ctx.beginPath();
  ctx.rect(clipX, clipY, clipW, clipH);
  ctx.clip();

  ctx.globalAlpha = opts.alpha !== undefined ? opts.alpha : 1;
  if(opts.shadow){ ctx.shadowColor = opts.shadow; ctx.shadowBlur = opts.shadowBlur || 22; }
  ctx.fillStyle = opts.color || '#ffffff';
  ctx.fillText(text, cx, cy);
  if(opts.shadow) ctx.fillText(text, cx, cy);
  ctx.restore();
}

function fadeText(text, cx, cy, font, opts){
  ctx.save();
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const p = clamp(opts.progress, 0, 1);
  const e = (opts.easing || E.outQuint)(p);
  const dy = lerp(opts.riseFrom !== undefined ? opts.riseFrom : 40, 0, e);
  ctx.globalAlpha = (opts.alpha !== undefined ? opts.alpha : 1) * clamp(e*1.4, 0, 1);
  if(opts.shadow){ ctx.shadowColor = opts.shadow; ctx.shadowBlur = opts.shadowBlur || 20; }
  ctx.fillStyle = opts.color || '#ffffff';
  ctx.fillText(text, cx, cy + dy);
  if(opts.shadow) ctx.fillText(text, cx, cy + dy);
  ctx.restore();
}

function staggerWords(text, cx, cy, font, opts){
  ctx.save();
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const words = text.split(' ');
  const n = words.length;
  const spaceW = ctx.measureText(' ').width;
  const widths = words.map(w => ctx.measureText(w).width);
  let total = spaceW * (n-1);
  for(const w of widths) total += w;

  let xRight = cx + total/2;

  for(let i=0;i<n;i++){
    const delay = i * (opts.stagger || 0.13);
    const span = 1 - (opts.stagger || 0.13) * (n-1);
    const local = clamp((opts.progress - delay) / Math.max(span, 0.3), 0, 1);
    const e = (opts.easing || E.outQuint)(local);
    const alpha = clamp(e * 1.5, 0, 1);
    const dy = (1-e) * (opts.riseFrom || 90);
    const dx = (1-e) * (opts.slideFrom || 0);

    const wx = xRight - widths[i]/2;
    ctx.save();
    ctx.translate(wx + dx, cy + dy);
    ctx.globalAlpha = (opts.alpha !== undefined ? opts.alpha : 1) * alpha;
    if(opts.shadow){ ctx.shadowColor = opts.shadow; ctx.shadowBlur = opts.shadowBlur || 20; }
    ctx.fillStyle = opts.color || '#ffffff';
    ctx.fillText(words[i], 0, 0);
    if(opts.shadow) ctx.fillText(words[i], 0, 0);
    ctx.restore();

    xRight -= widths[i] + spaceW;
  }
  ctx.restore();
}

/* ============================================================
   AUDIO (SFX only, no hum)
   ============================================================ */
let audioCtx = null, master = null, noiseBuf = null;
function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  master = audioCtx.createGain();
  master.gain.value = 0.9;
  master.connect(audioCtx.destination);
}
function getNoise(){
  if(noiseBuf) return noiseBuf;
  const len = Math.floor(audioCtx.sampleRate);
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return noiseBuf;
}
function sWhoosh(t, targetFreq, dur){
  dur = dur || 0.42;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  f.type='bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(320,t);
  f.frequency.exponentialRampToValueAtTime(targetFreq||2600,t+dur*0.85);
  o.type='sawtooth';
  o.frequency.setValueAtTime(110,t);
  o.frequency.exponentialRampToValueAtTime(520,t+dur*0.85);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.07,t+0.055);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.05);
}
function sImpact(t, amp){
  amp = amp || 1;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(160,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.32);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.24*amp,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+0.55);
  const n=audioCtx.createBufferSource(), nf=audioCtx.createBiquadFilter(), ng=audioCtx.createGain();
  n.buffer = getNoise();
  nf.type='lowpass'; nf.frequency.setValueAtTime(2400,t);
  nf.frequency.exponentialRampToValueAtTime(240,t+0.18);
  ng.gain.setValueAtTime(0.10*amp,t);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  n.connect(nf); nf.connect(ng); ng.connect(master);
  n.start(t); n.stop(t+0.22);
}
function sClick(t, freq, amp){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='triangle'; o.frequency.value = freq||1300;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.045*(amp||1),t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.075);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+0.09);
}
function sRiser(t, dur){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  f.type='lowpass'; f.frequency.setValueAtTime(400,t);
  f.frequency.exponentialRampToValueAtTime(3600,t+dur);
  o.type='sawtooth';
  o.frequency.setValueAtTime(170,t);
  o.frequency.exponentialRampToValueAtTime(760,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.032,t+dur*0.85);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.05);
  o.connect(f); f.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.1);
}
function sSoftChime(t){
  [880, 1318.5].forEach((f,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    const st = t + i*0.08;
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.04,st+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.5);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st+0.55);
  });
}
function sNotify(t){
  [1046.5, 1318.5, 1568].forEach((f,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    const st = t + i*0.1;
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.055,st+0.014);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.36);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st+0.4);
  });
}

/* ============================================================
   VOICEOVER
   ============================================================ */
let voiceEnabled = true;
function pickArabicVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  const arVoices = voices.filter(v => /ar/i.test(v.lang));
  if(!arVoices.length) return null;
  const prefer = ['Maged', 'Tarik', 'Hoda', 'Zeina', 'Laila', 'Sana'];
  for(const p of prefer){
    const found = arVoices.find(v => v.name.includes(p));
    if(found) return found;
  }
  return arVoices[0];
}
function speakArabic(text, rate, pitch){
  if(!voiceEnabled || !('speechSynthesis' in window)) return;
  const voice = pickArabicVoice();
  if(!voice) return;
  const u = new SpeechSynthesisUtterance(text);
  u.voice = voice;
  u.lang = voice.lang || 'ar-SA';
  u.rate = rate || 0.95;
  u.pitch = pitch || 1.0;
  u.volume = 1.0;
  speechSynthesis.speak(u);
}
function stopVoice(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

/* ============================================================
   BACKGROUND
   ============================================================ */
function drawBackground(t, px, py, palette){
  palette = palette || { a:[8,12,26], b:[18,22,42], c:[6,9,18] };

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,    `rgb(${palette.a[0]},${palette.a[1]},${palette.a[2]})`);
  g.addColorStop(0.45, `rgb(${palette.b[0]},${palette.b[1]},${palette.b[2]})`);
  g.addColorStop(1,    `rgb(${palette.c[0]},${palette.c[1]},${palette.c[2]})`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const orbs = [
    {c:'rgba(60,140,220,0.16)', r:900, ox:0.26, oy:0.22, sx:0.08, sy:0.07},
    {c:'rgba(120,80,200,0.11)', r:820, ox:0.76, oy:0.78, sx:-0.06, sy:0.05}
  ];
  orbs.forEach((o,i)=>{
    const x = W*(o.ox + Math.sin(t*o.sx + i*1.7)*0.14) + px*0.2;
    const y = H*(o.oy + Math.cos(t*o.sy + i*2.3)*0.12) + py*0.2;
    const rg = ctx.createRadialGradient(x,y,0,x,y,o.r);
    rg.addColorStop(0, o.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0,0,W,H);
  });
  ctx.restore();

  ctx.save();
  const off = (t*14) % 120;
  ctx.fillStyle = 'rgba(120,160,220,0.035)';
  for(let x=60 + px*0.4;x<W+60;x+=120){
    for(let y=-off+60 + py*0.4;y<H+60;y+=120){
      ctx.beginPath();
      ctx.arc(x,y,1.3,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const vx = ((t*50) % (W+600)) - 300 + px*0.3;
  const vg = ctx.createLinearGradient(vx-200,0,vx+200,H);
  vg.addColorStop(0,'rgba(120,180,255,0)');
  vg.addColorStop(0.5,'rgba(120,180,255,0.035)');
  vg.addColorStop(1,'rgba(120,180,255,0)');
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

/* ============================================================
   SCENE CAMERAS
   ============================================================ */
function scene1Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.5, 0, 1);
  const exit  = clamp((lt - (dur-0.35))/0.4, 0, 1);
  s = lerp(1.10, 1, E.outExpo(enter));
  a = E.outCubic(enter);
  const ex = E.inCubic(exit);
  x = lerp(0, -W*1.15, ex);
  s = lerp(1, 1.10, ex);
  a *= 1 - ex;
  return { x, y, s, a };
}
function scene2Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.4, 0, 1);
  const exit  = clamp((lt - (dur-0.4))/0.4, 0, 1);
  const en = E.outExpo(enter);
  x = lerp(W*1.15, 0, en);
  a = E.outCubic(enter);
  const ex = E.inCubic(exit);
  s = lerp(1, 1.7, ex);
  a *= 1 - ex;
  return { x, y, s, a };
}
function scene3Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.5, 0, 1);
  const exit  = clamp((lt - (dur-0.35))/0.4, 0, 1);
  const en = E.outExpo(enter);
  s = lerp(0.65, 1, en);
  a = E.outCubic(enter);
  const ex = E.inCubic(exit);
  y = lerp(0, -H*1.15, ex);
  s = lerp(1, 1.10, ex);
  a *= 1 - ex;
  return { x, y, s, a };
}
function scene4Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.5, 0, 1);
  const exit  = clamp((lt - (dur-0.35))/0.4, 0, 1);
  const en = E.outExpo(enter);
  y = lerp(H*1.15, 0, en);
  a = E.outCubic(enter);
  const ex = E.inCubic(exit);
  x = lerp(0, W*1.15, ex);
  s = lerp(1, 1.06, ex);
  a *= 1 - ex;
  return { x, y, s, a };
}
function scene5Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.5, 0, 1);
  const exit  = clamp((lt - (dur-0.35))/0.4, 0, 1);
  const en = E.outExpo(enter);
  x = lerp(-W*1.15, 0, en);
  a = E.outCubic(enter);
  const ex = E.inCubic(exit);
  s = lerp(1, 1.65, ex);
  a *= 1 - ex;
  return { x, y, s, a };
}
function scene6Camera(lt, dur){
  let x = 0, y = 0, s = 1, a = 1;
  const enter = clamp(lt/0.6, 0, 1);
  const en = E.outExpo(enter);
  s = lerp(1.08, 1, en);
  a = E.outCubic(enter);
  return { x, y, s, a };
}

/* ============================================================
   SCENE 1 : HOOK
   ============================================================ */
function drawScene1(lt, dur){
  const cam = scene1Camera(lt, dur);
  ctx.save();
  ctx.globalAlpha = cam.a;
  ctx.translate(W/2 + cam.x, H/2 + cam.y);
  ctx.scale(cam.s, cam.s);
  ctx.translate(-W/2, -H/2);

  const dropP = E.outQuint(clamp(lt/0.55, 0, 1));
  const pinY = lerp(-200, 540, dropP);
  const pinAlpha = clamp(lt/0.3, 0, 1);

  ctx.save();
  ctx.globalAlpha = pinAlpha * 0.9;
  ctx.translate(W/2, pinY);
  drawSvgPath(PIN_ICON, 0, 0, 90, '#5cb8ff', 'rgba(80,170,255,0.55)', 22);
  ctx.restore();

  if(lt > 0.5){
    for(let i=0;i<2;i++){
      const rt = lt - 0.5 - i*0.28;
      if(rt < 0) continue;
      const rp = Math.min(rt/1.0, 1);
      const r = 50 + rp*90;
      ctx.save();
      ctx.globalAlpha = pinAlpha * (1-rp)*0.35;
      ctx.strokeStyle = '#5cb8ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(W/2, 540, r, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }
  }

  const l1P = E.outQuint(clamp((lt-0.35)/0.65, 0, 1));
  staggerWords('إذا انته طالب مهني', W/2, 760, '900 100px Cairo', {
    progress: l1P,
    stagger: 0.14,
    easing: E.outQuint,
    riseFrom: 90,
    color: '#ffffff',
    shadow: 'rgba(90,170,255,0.55)',
    shadowBlur: 26,
    alpha: cam.a
  });

  const l2P = E.outExpo(clamp((lt-0.75)/0.6, 0, 1));
  revealText('ومن الكوت', W/2, 900, '900 128px Cairo', {
    progress: l2P,
    dir: 'rtl',
    color: '#ffffff',
    shadow: 'rgba(90,170,255,0.7)',
    shadowBlur: 30,
    alpha: cam.a
  });

  const ulP = E.outCubic(clamp((lt-0.98)/0.55, 0, 1));
  if(ulP > 0){
    const lw = 460 * ulP;
    const lg = ctx.createLinearGradient(W/2-lw/2, 0, W/2+lw/2, 0);
    lg.addColorStop(0, 'rgba(92,184,255,0)');
    lg.addColorStop(0.5, 'rgba(92,184,255,0.95)');
    lg.addColorStop(1, 'rgba(92,184,255,0)');
    ctx.save();
    ctx.globalAlpha = cam.a;
    ctx.fillStyle = lg;
    ctx.fillRect(W/2-lw/2, 984, lw, 3.5);
    ctx.restore();
  }

  const tagP = E.outQuint(clamp((lt-1.5)/0.6, 0, 1));
  if(tagP > 0){
    ctx.save();
    ctx.globalAlpha = cam.a * tagP * 0.75;
    ctx.font = '700 30px Cairo';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#88a6d8';
    try { ctx.letterSpacing = '6px'; } catch(e){}
    ctx.fillText('دورات المهني · محافظة واسط', W/2, 1300);
    ctx.restore();
  }

  ctx.restore();
}

  ctx.globalAlpha = cp;
  ctx.translate(cX, cY);
  ctx.scale(lerp(0.94,1,cp), lerp(0.94,1,cp));
  ctx.translate(-cX, -cY);

  const cardGrad = ctx.createLinearGradient(0, cY-ch/2, 0, cY+ch/2);
  cardGrad.addColorStop(0,'rgba(120,160,240,0.08)');
  cardGrad.addColorStop(1,'rgba(60,90,180,0.02)');
  ctx.beginPath();
  const r = 40;
  ctx.moveTo(cX-cw/2+r, cY-ch/2);
  ctx.arcTo(cX+cw/2, cY-ch/2, cX+cw/2, cY+ch/2, r);
  ctx.arcTo(cX+cw/2, cY+ch/2, cX-cw/2, cY+ch/2, r);
  ctx.arcTo(cX-cw/2, cY+ch/2, cX-cw/2, cY-ch/2, r);
  ctx.arcTo(cX-cw/2, cY-ch/2, cX+cw/2, cY-ch/2, r);
  ctx.closePath();
  ctx.fillStyle = cardGrad;
  ctx.fill();

  const strokeG = ctx.createLinearGradient(cX-cw/2, cY-ch/2, cX+cw/2, cY+ch/2);
  strokeG.addColorStop(0,'rgba(120,180,255,0.45)');
  strokeG.addColorStop(1,'rgba(120,140,255,0.15)');
  ctx.strokeStyle = strokeG;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  const sweep = clamp((lt-0.6)/0.9, 0, 1);

    ctx.beginPath();
    const r2 = 40;

    ctx.arcTo(cX+cw/2, cY-ch/2, cX+cw/2, cY+ch/2, r2);
    ctx.arcTo(cX+cw/2, cY+ch/2, cX-cw/2, cY+ch/2, r2);
    ctx.arcTo(cX-cw/2, cY+ch/2, cX-cw/2, cY-ch/2, r2);
    ctx.arcTo(cX-cw/2, cY-ch/2, cX+cw/2, cY-ch/2, r2);
    ctx.closePath();
    ctx.clip();
    const sx = lerp(cX-cw/2-260, cX+cw/2+260, E.inOutCubic(sweep));

    sg.addColorStop(0.5, 'rgba(180,220,255,0.10)');
    sg.addColorStop(1, 'rgba(180,220,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx-220, cY-ch/2, 440, ch);
    ctx.restore();
  }

  const hp = E.outQuint(clamp((lt-0.28)/0.45, 0, 1));
  fadeText('دورات', W/2, cY - ch/2 + 80, '700 42px Cairo', {
    progress: hp,
    riseFrom: 22,
    color: '#7fc4ff',
    alpha: cam.a
  });

  const divP = E.outCubic(clamp((lt-0.42)/0.5, 0, 1));
  if(divP > 0){
    const dw = 260 * divP;
    const dg = ctx.createLinearGradient(W/2-dw/2, 0, W/2+dw/2, 0);
    dg.addColorStop(0,'rgba(120,180,255,0)');
    dg.addColorStop(0.5,'rgba(140,180,255,0.75)');
    dg.addColorStop(1,'rgba(120,180,255,0)');
    ctx.save();
    ctx.globalAlpha = cam.a;
    ctx.fillStyle = dg;
    ctx.fillRect(W/2-dw/2, cY - ch/2 + 128, dw, 2);
    ctx.restore();
  }

  const mp = E.outQuint(clamp((lt-0.55)/0.5, 0, 1));
  revealText('المهندس', W/2, cY - 130, '700 54px Cairo', {
    progress: mp,
    dir: 'ltr',
    color: '#a9c8ec',
    alpha: cam.a
  });

  const np = E.outQuint(clamp((lt-0.7)/0.55, 0, 1));
  staggerWords('حسن فلاح', W/2, cY - 20, '900 108px Cairo', {
    progress: np,
    stagger: 0.22,
    easing: E.outQuint,
    riseFrom: 70,
    color: '#ffffff',
    shadow: 'rgba(120,170,255,0.5)',
    shadowBlur: 24,
    alpha: cam.a
  });

  const sp = E.outQuint(clamp((lt-0.95)/0.55, 0, 1));
  staggerWords('الموسوي', W/2, cY + 118, '900 108px Cairo', {
    progress: sp,
    stagger: 0.2,
    easing: E.outQuint,
    riseFrom: 70,
    color: '#ffffff',
    shadow: 'rgba(120,170,255,0.5)',
    shadowBlur: 24,
    alpha: cam.a
  });

  ctx.restore();

/* ============================================================
   SCENE 3 : PHYSICS
   ============================================================ */
function drawScene3(lt, dur){
  const cam = scene3Camera(lt, dur);
  ctx.save();
  ctx.globalAlpha = cam.a;
  ctx.translate(W/2 + cam.x, H/2 + cam.y);
  ctx.scale(cam.s, cam.s);
  ctx.translate(-W/2, -H/2);

  const centerY = H/2 - 380;
  const waveW = 720;

  ctx.save();
  ctx.translate(W/2, centerY);

  const hg = ctx.createRadialGradient(0,0,0,0,0,420);
  hg.addColorStop(0, 'rgba(90,170,255,0.10)');
  hg.addColorStop(1, 'rgba(90,170,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(-460, -300, 920, 600);

  const w1P = E.outCubic(clamp(lt/0.65, 0, 1));
  if(w1P > 0){
    ctx.save();
    ctx.strokeStyle = 'rgba(92,180,255,0.95)';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    const drawW = waveW * w1P;
    for(let i=0;i<=200;i++){
      const x = -waveW/2 + (drawW * i/200);
      const phase = (i/200) * Math.PI * 4 + lt*2.2;
      const y = Math.sin(phase) * 62;
      if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  const w2P = E.outCubic(clamp((lt-0.15)/0.65, 0, 1));
  if(w2P > 0){
    ctx.save();
    ctx.strokeStyle = 'rgba(150,130,255,0.7)';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    const drawW = waveW * w2P;
    for(let i=0;i<=200;i++){
      const x = -waveW/2 + (drawW * i/200);
      const phase = (i/200) * Math.PI * 4 + lt*2.2 + Math.PI;
      const y = Math.sin(phase) * 62;
      if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  if(lt > 0.5){
    const arcP = E.outCubic(clamp((lt-0.5)/0.4, 0, 1));
    ctx.save();
    ctx.globalAlpha = arcP;
    ctx.strokeStyle = '#f0e28a';
    ctx.lineWidth = 1.6;
    ctx.shadowColor = 'rgba(240,226,138,0.55)';
    ctx.shadowBlur = 14;
    const segs = 18;
    const x1 = -180, y1 = -150, x2 = 180, y2 = -150;
    ctx.beginPath();
    for(let i=0;i<=segs;i++){
      const k = i/segs;
      const jitter = Math.sin(lt*22 + i*1.7) * 4 + Math.cos(lt*17 + i*2.3) * 3;
      const x = lerp(x1, x2, k);
      const y = lerp(y1, y2, k) + (k>0.05 && k<0.95 ? jitter : 0);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff7c4';
    ctx.beginPath(); ctx.arc(x1,y1,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2,y2,4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.font = '700 44px Cairo';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const symbols = [
    { s: 'λ',  x: -280, y:  190, delay: 0.6 },
    { s: 'F',  x:  290, y:  200, delay: 0.75 },
    { s: 'Ω',  x:    0, y:  230, delay: 0.9 }
  ];
  symbols.forEach((sym,i)=>{
    const sp = E.outQuint(clamp((lt-sym.delay)/0.55, 0, 1));
    if(sp <= 0) return;
    ctx.save();
    ctx.globalAlpha = sp * 0.55;
    ctx.translate(sym.x, sym.y + Math.sin(lt*1.4 + i*1.3)*7);
    ctx.fillStyle = '#7fc4ff';
    ctx.fillText(sym.s, 0, 0);
    ctx.restore();
  });
  ctx.restore();

  ctx.restore();

  const tp = E.outExpo(clamp((lt-0.55)/0.55, 0, 1));
  revealText('طبيعيات', W/2, H/2 + 40, '900 168px Cairo', {
    progress: tp,
    dir: 'rtl',
    color: '#ffffff',
    shadow: 'rgba(90,170,255,0.65)',
    shadowBlur: 32,
    alpha: cam.a
  });

  const dp = E.outCubic(clamp((lt-0.9)/0.5, 0, 1));
  if(dp > 0){
    const dw = 400 * dp;
    const dg = ctx.createLinearGradient(W/2-dw/2, 0, W/2+dw/2, 0);
    dg.addColorStop(0,'rgba(92,180,255,0)');
    dg.addColorStop(0.5,'rgba(92,180,255,0.95)');
    dg.addColorStop(1,'rgba(92,180,255,0)');
    ctx.save();
    ctx.globalAlpha = cam.a;
    ctx.fillStyle = dg;
    ctx.fillRect(W/2-dw/2, H/2 + 150, dw, 3);
    ctx.restore();
  }

  const sp = E.outQuint(clamp((lt-1.05)/0.55, 0, 1));
  fadeText('لكافة الأقسام المهنية', W/2, H/2 + 250, '700 66px Cairo', {
    progress: sp,
    riseFrom: 40,
    color: '#9bc9ff',
    alpha: cam.a
  });

  ctx.restore();
}

/* ============================================================
   SCENE 4 : MEDICAL
   ============================================================ */
function drawScene4(lt, dur){
  const cam = scene4Camera(lt, dur);
  ctx.save();
  ctx.globalAlpha = cam.a;
  ctx.translate(W/2 + cam.x, H/2 + cam.y);
  ctx.scale(cam.s, cam.s);
  ctx.translate(-W/2, -H/2);

  const devY = H/2 - 380;
  const devW = 720, devH = 480;

  const dP = E.outQuint(clamp(lt/0.6, 0, 1));

  ctx.save();
  ctx.translate(W/2, devY);
  ctx.scale(lerp(0.92,1,dP), lerp(0.92,1,dP));
  ctx.globalAlpha = cam.a * dP;

  const bg = ctx.createRadialGradient(0,0,0,0,0,460);
  bg.addColorStop(0, 'rgba(80,220,140,0.10)');
  bg.addColorStop(1, 'rgba(80,220,140,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(-500, -340, 1000, 680);

  const r = 26;
  ctx.beginPath();
  ctx.moveTo(-devW/2+r, -devH/2);
  ctx.arcTo(devW/2, -devH/2, devW/2, devH/2, r);
  ctx.arcTo(devW/2, devH/2, -devW/2, devH/2, r);
  ctx.arcTo(-devW/2, devH/2, -devW/2, -devH/2, r);
  ctx.arcTo(-devW/2, -devH/2, devW/2, -devH/2, r);
  ctx.closePath();

  const devFill = ctx.createLinearGradient(0, -devH/2, 0, devH/2);
  devFill.addColorStop(0, 'rgba(20,40,32,0.9)');
  devFill.addColorStop(1, 'rgba(10,24,18,0.9)');
  ctx.fillStyle = devFill;
  ctx.fill();

  ctx.strokeStyle = 'rgba(90,220,140,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const inset = 26;
  ctx.beginPath();
  const r2 = 14;
  ctx.moveTo(-devW/2+inset+r2, -devH/2+inset);
  ctx.arcTo(devW/2-inset, -devH/2+inset, devW/2-inset, devH/2-inset, r2);
  ctx.arcTo(devW/2-inset, devH/2-inset, -devW/2+inset, devH/2-inset, r2);
  ctx.arcTo(-devW/2+inset, devH/2-inset, -devW/2+inset, -devH/2+inset, r2);
  ctx.arcTo(-devW/2+inset, -devH/2+inset, devW/2-inset, -devH/2+inset, r2);
  ctx.closePath();
  ctx.fillStyle = 'rgba(6,20,12,0.95)';
  ctx.fill();

  ctx.save();
  ctx.clip();

  if(lt > 0.35){
    const ep = E.outCubic(clamp((lt-0.35)/0.9, 0, 1));
    const innerW = devW - inset*2;
    const drawStart = -innerW/2;
    const drawEnd = drawStart + innerW*ep;

    ctx.beginPath();
    ctx.strokeStyle = '#4fe08a';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(80,220,140,0.55)';
    ctx.shadowBlur = 12;

    const ecg = (x)=>{
      const period = 200;
      const ph = ((x + lt*220) % period + period) % period;
      if(ph < 60) return 0;
      if(ph < 74) return -14;
      if(ph < 86) return 62;
      if(ph < 98) return -80;
      if(ph < 112) return 26;

function drawScene5(lt, dur){

  ctx.fillRect(-460, -320, 920, 640);

  const fP = E.outQuint(clamp(lt/0.6, 0, 1));
  ctx.globalAlpha = cam.a * fP;

  const ct = lt * 1.6;

  const hipX = 0, hipY = 40;
  const shoulderX = 0, shoulderY = -110;
  const headY = -160;

  const armSwing = Math.sin(ct*Math.PI*2) * 0.6;
  const legSwing = Math.sin(ct*Math.PI*2 + Math.PI) * 0.55;

  const lElbowX = shoulderX + Math.sin(-Math.PI/2 + armSwing + 0.4) * 40;
  const lElbowY = shoulderY + Math.cos(-Math.PI/2 + armSwing + 0.4) * 40;
  const rElbowX = shoulderX + Math.sin(-Math.PI/2 - armSwing - 0.4) * 40;
  const rElbowY = shoulderY + Math.cos(-Math.PI/2 - armSwing - 0.4) * 40;
  const lHandX = lElbowX + Math.sin(-Math.PI/2 + armSwing*1.1 - 0.4) * 42;
  const lHandY = lElbowY + Math.cos(-Math.PI/2 + armSwing*1.1 - 0.4) * 42;
  const rHandX = rElbowX + Math.sin(-Math.PI/2 - armSwing*1.1 + 0.4) * 42;
  const rHandY = rElbowY + Math.cos(-Math.PI/2 - armSwing*1.1 + 0.4) * 42;

  const lKneeX = hipX + Math.sin(Math.PI/2 + legSwing) * 55;
  const lKneeY = hipY + Math.cos(Math.PI/2 + legSwing) * 55;
  const rKneeX = hipX + Math.sin(Math.PI/2 - legSwing) * 55;
  const rKneeY = hipY + Math.cos(Math.PI/2 - legSwing) * 55;
  const lFootX = lKneeX + Math.sin(Math.PI/2 + legSwing*0.4 - 0.3) * 55;
  const lFootY = lKneeY + Math.cos(Math.PI/2 + legSwing*0.4 - 0.3) * 55;
  const rFootX = rKneeX + Math.sin(Math.PI/2 - legSwing*0.4 + 0.3) * 55;
  const rFootY = rKneeY + Math.cos(Math.PI/2 - legSwing*0.4 + 0.3) * 55;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#f0a830';
  ctx.shadowColor = 'rgba(240,168,60,0.4)';
  ctx.shadowBlur = 10;

  ctx.beginPath();
  ctx.moveTo(shoulderX, shoulderY);
  ctx.lineTo(hipX, hipY);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(shoulderX, headY, 24, 0, Math.PI*2);
  ctx.fillStyle = '#f0a830';
  ctx.fill();

  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(lElbowX, lElbowY);
  ctx.moveTo(lElbowX, lElbowY); ctx.lineTo(lHandX, lHandY);
  ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(rElbowX, rElbowY);
  ctx.moveTo(rElbowX, rElbowY); ctx.lineTo(rHandX, rHandY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(hipX, hipY); ctx.lineTo(lKneeX, lKneeY);
  ctx.moveTo(lKneeX, lKneeY); ctx.lineTo(lFootX, lFootY);
  ctx.moveTo(hipX, hipY); ctx.lineTo(rKneeX, rKneeY);
  ctx.moveTo(rKneeX, rKneeY); ctx.lineTo(rFootX, rFootY);
  ctx.stroke();

  ctx.shadowBlur = 0;
  const joints = [
    [hipX, hipY], [shoulderX, shoulderY],
    [lKneeX, lKneeY], [rKneeX, rKneeY],
    [lElbowX, lElbowY], [rElbowX, rElbowY],
    [lFootX, lFootY], [rFootX, rFootY]
  ];
  if(lt > 0.5){
    const jP = E.outQuint(clamp((lt-0.5)/0.6, 0, 1));

      ctx.beginPath();

      ctx.fill();
    });

  }

  if(lt > 0.6){
    const mP = E.outCubic(clamp((lt-0.6)/0.7, 0, 1));
    ctx.globalAlpha = cam.a * fP * mP * 0.7;
    ctx.strokeStyle = 'rgba(240,168,60,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.lineDashOffset = -lt*50;
    ctx.beginPath();
    ctx.arc(-90, 20, 200, -Math.PI*0.35, Math.PI*0.35);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = cam.a * fP;
  }

  if(lt > 0.9){

    ctx.font = '700 24px Cairo';

  }

  ctx.restore();

  const tp = E.outExpo(clamp((lt-0.55)/0.55, 0, 1));
  revealText('بايوميكانيك', W/2, H/2 + 40, '900 148px Cairo', {
    progress: tp,

  });

const noiseCv = document.createElement('canvas');
noiseCv.width = noiseCv.height = 200;
(function(){
  const nc = noiseCv.getContext('2d');
  const id = nc.createImageData(200,200);
  for(let i=0;i<id.data.length;i+=4){
    const v = 130 + Math.random()*125;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;
    id.data[i+3] = 14;
  }
  nc.putImageData(id,0,0);
})();
let noisePattern = null;
function drawGrain(){
  if(!noisePattern) noisePattern = ctx.createPattern(noiseCv,'repeat');
  if(!noisePattern) return;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.globalCompositeOperation = 'overlay';
  const ox = (Math.random()*200)|0, oy = (Math.random()*200)|0;
  ctx.translate(-ox,-oy);
  ctx.fillStyle = noisePattern;
  ctx.fillRect(0,0,W+200,H+200);
  ctx.restore();
}
function drawVignette(){
  const v = ctx.createRadialGradient(W/2,H*0.46,340, W/2,H*0.5,1200);
  v.addColorStop(0,'rgba(0,0,0,0)');
  v.addColorStop(0.65,'rgba(0,0,0,0.22)');
  v.addColorStop(1,'rgba(0,0,0,0.65)');
  ctx.fillStyle = v;
  ctx.fillRect(0,0,W,H);
}

function currentPalette(t){
  let a = SCENES[0].palette, b = SCENES[0].palette, k = 0;
  for(let i=0;i<SCENES.length;i++){
    const s = SCENES[i];
    if(t >= s.start && t < s.end){
      a = s.palette;
      b = SCENES[Math.min(i+1, SCENES.length-1)].palette;
      k = clamp((t - (s.end - 0.35)) / 0.6, 0, 1);
      break;
    }
  }
  const mix = (c1,c2,k)=>[
    Math.round(lerp(c1[0], c2[0], k)),
    Math.round(lerp(c1[1], c2[1], k)),
    Math.round(lerp(c1[2], c2[2], k))
  ];
  return { a: mix(a.a, b.a, k), b: mix(a.b, b.b, k), c: mix(a.c, b.c, k) };
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(t){
  ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);

  const camX = Math.sin(t*0.28)*10 + Math.sin(t*0.68)*5;
  const camY = Math.cos(t*0.34)*7 + Math.cos(t*0.79)*4;

  const pal = currentPalette(t);
  drawBackground(t, camX, camY, pal);

  ctx.save();
  ctx.translate(camX, camY);
  for(const s of SCENES){
    const lt = t - s.start;
    if(lt < -0.2) continue;
    if(lt > (s.end - s.start) + 0.2) continue;
    ctx.save();
    s.draw(lt, s.end - s.start);
    ctx.restore();
  }
  ctx.restore();

  drawGrain();
  drawVignette();

  const tt = clamp(t, 0, DURATION);
  barEl.style.width = (tt/DURATION*100)+'%';
  const sec = Math.floor(tt);
  timeEl.textContent = `00:${String(sec).padStart(2,'0')} / 00:16`;
}

  for(const [time, key, fn] of SOUND_EVENTS){
    if(t >= time && !fired[key]){
      fired[key] = true;
      try { fn(audioCtx.currentTime); } catch(e){}
    }
  }
  if(voiceEnabled){
    for(const v of VOICEOVER_SCRIPT){
      if(t >= v.at && !fired['v_'+v.at]){
        fired['v_'+v.at] = true;
        try { speakArabic(v.text, 0.98, 1.0); } catch(e){}
      }
    }
  }
}
setInterval(triggerSounds, 40);

/* ============================================================
   PLAY LOOP
   ============================================================ */
let startTime = 0, playing = false, rafId = null;

function loop(){
  const t = (performance.now() - startTime)/1000;
  if(t >= DURATION){
    render(DURATION);
    finishPlayback();
    return;
  }
  render(t);
  rafId = requestAnimationFrame(loop);
}

function finishPlayback(){
  cancelAnimationFrame(rafId);
  playing = false;
  stopVoice();
  playBtn.disabled = false;
  statusEl.textContent = '✓ انتهى الإعلان';
  barEl.style.width = '100%';
  timeEl.textContent = '00:16 / 00:16';
}

function play(){
  initAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  cancelAnimationFrame(rafId);
  stopVoice();
  fired = {};
  startTime = performance.now();
  playing = true;
  playBtn.disabled = true;
  statusEl.textContent = '● جاري التشغيل...';
  render(0);
  rafId = requestAnimationFrame(loop);
}

function reset(){
  cancelAnimationFrame(rafId);
  playing = false;
  stopVoice();
  fired = {};
  playBtn.disabled = false;
  barEl.style.width = '0%';
  timeEl.textContent = '00:00 / 00:16';
  statusEl.textContent = 'جاهز للتشغيل';
  ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);
  drawBackground(0, 0, 0, SCENES[0].palette);
}

/* ============================================================
   DIRECT VIDEO EXPORT — offline frame-by-frame encoding
   (No screen recording — frames are rendered + packed into WebM)
   ============================================================ */
const EXPORT_FPS = 30;
const EXPORT_DURATION = DURATION;

async function exportVideo(){
  if(!window.Whammy || typeof Whammy.Video !== 'function'){
    statusEl.textContent = '⚠ فشل تحميل مكتبة التصدير. تحقق من الاتصال بالإنترنت.';
    return;
  }

  // Disable UI during export
  dlBtn.disabled = true;
  playBtn.disabled = true;
  resetBtn.disabled = true;
  dlBtn.classList.add('busy');
  dlLabel.textContent = 'جاري التصدير...';
  statusEl.textContent = '⏳ جاري بناء الفيديو إطاراً بإطار...';

  // Save current state
  const realCanvas = canvas;
  const realCtx = ctx;
  const realScale = RES_SCALE;

  // Create offscreen export canvas at 1080×1920 (standard vertical HD)
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width = 1080;
  exportCanvas.height = 1920;
  const exportCtx = exportCanvas.getContext('2d', { alpha: false });

  // Swap global canvas/ctx so render() targets the export canvas
  canvas = exportCanvas;
  ctx = exportCtx;
  RES_SCALE = 1;

  const totalFrames = Math.ceil(EXPORT_DURATION * EXPORT_FPS);
  const encoder = new Whammy.Video(EXPORT_FPS);

  try {
    for(let i = 0; i < totalFrames; i++){
      const t = i / EXPORT_FPS;
      render(t);

      // Whammy rule: when fps is set in the constructor, call add()
      // with NO duration argument. Whammy handles timing automatically.
      encoder.add(exportCanvas);

      // Update progress + yield to keep the UI responsive
      if(i % 2 === 0){
        const pct = Math.round((i / totalFrames) * 100);
        dlLabel.textContent = `جاري التصدير... ${pct}%`;
        statusEl.textContent = `⏳ معالجة الإطارات (${i}/${totalFrames})`;
        barEl.style.width = (i / totalFrames * 100)+'%';
        await new Promise(r => setTimeout(r, 0));
      }
    }

    statusEl.textContent = '⏳ جاري ترميز الملف النهائي...';
    await new Promise(r => setTimeout(r, 60));

    const blob = encoder.compile();
    const url = URL.createObjectURL(blob);
    const fname = `إعلان_دورات_حسن_فلاح_الموسوي_${Date.now()}.webm`;

    // Trigger download
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 90 * 1000);

    statusEl.textContent = '✓ تم التنزيل — تحقق من مجلد التنزيلات';
    dlLabel.textContent = 'تنزيل الفيديو مرة أخرى';
  } catch(err){
    console.error(err);
    statusEl.textContent = '⚠ حدث خطأ أثناء التصدير: ' + (err.message || err);
    dlLabel.textContent = 'إعادة محاولة التنزيل';
  } finally {
    // Restore
    canvas = realCanvas;
    ctx = realCtx;
    RES_SCALE = realScale;
    dlBtn.disabled = false;
    playBtn.disabled = false;
    resetBtn.disabled = false;
    dlBtn.classList.remove('busy');
    barEl.style.width = '0%';
    timeEl.textContent = '00:00 / 00:16';
    // Repaint the visible canvas
    ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);
    render(0);
  }
}

/* ============================================================
   VOICE TOGGLE
   ============================================================ */
voiceBtn.addEventListener('click', ()=>{
  voiceEnabled = !voiceEnabled;
  voiceBtn.classList.toggle('off', !voiceEnabled);
  voiceLabel.textContent = voiceEnabled ? 'التعليق الصوتي: مفعّل' : 'التعليق الصوتي: متوقف';
  if(!voiceEnabled) stopVoice();
});

/* ============================================================
   EVENTS + BOOT
   ============================================================ */
playBtn.addEventListener('click', play);
resetBtn.addEventListener('click', reset);
dlBtn.addEventListener('click', exportVideo);

function boot(){
  ctx.setTransform(RES_SCALE, 0, 0, RES_SCALE, 0, 0);
  drawBackground(0, 0, 0, SCENES[0].palette);
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
} else {
  boot();
}
setTimeout(boot, 500);

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = ()=>{};
  speechSynthesis.getVoices();
}
</script>
